<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#080b16" />
    <title>Bitty</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; color: #f8fafc; background: radial-gradient(circle at top right, #172554 0, #080b16 42%); }
      main { min-height: 100vh; display: grid; place-items: center; padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom)); }
      section { width: min(100%, 420px); padding: 28px; border: 1px solid #25304a; border-radius: 24px; background: rgba(13, 18, 34, .94); box-shadow: 0 24px 72px rgba(0, 0, 0, .38); }
      .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
      .mark { display: grid; width: 44px; height: 44px; place-items: center; border-radius: 14px; color: #07121a; background: linear-gradient(135deg, #5eead4, #38bdf8); font-weight: 900; font-size: 23px; }
      h1 { margin: 0; font-size: 26px; letter-spacing: -.03em; }
      h2 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0 0 22px; color: #9caac2; line-height: 1.55; }
      label { display: block; margin-bottom: 8px; color: #cbd5e1; font-size: 14px; font-weight: 700; }
      input { width: 100%; min-height: 52px; padding: 0 15px; border: 1px solid #33415f; border-radius: 13px; outline: none; color: #f8fafc; background: #090e1d; font: inherit; }
      input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, .14); }
      button { width: 100%; min-height: 52px; margin-top: 12px; border: 0; border-radius: 13px; color: #06121a; background: linear-gradient(135deg, #5eead4, #38bdf8); font: 800 16px inherit; cursor: pointer; }
      button:active { transform: translateY(1px); }
      #message { min-height: 22px; margin: 12px 0 0; color: #fda4af; font-size: 13px; }
      small { display: block; margin-top: 18px; color: #64748b; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <div class="brand"><div class="mark">B</div><h1>Bitty</h1></div>
        <h2>Conectar ao notebook</h2>
        <p>Informe o endereço HTTPS privado mostrado pelo Tailscale no seu PC. O app e o painel usarão os mesmos dados.</p>
        <form id="connect-form">
          <label for="server-url">Endereço do Bitty</label>
          <input id="server-url" type="url" inputmode="url" autocomplete="url" autocapitalize="none" spellcheck="false" placeholder="https://meu-notebook.tailnet.ts.net" required />
          <button type="submit">Conectar com segurança</button>
          <p id="message" role="alert" aria-live="polite"></p>
        </form>
        <small>Por segurança, o APK aceita somente HTTPS em um domínio privado <strong>.ts.net</strong>. O dinheiro e as chaves da corretora continuam no notebook.</small>
      </section>
    </main>
    <script>
      const form = document.querySelector("#connect-form");
      const field = document.querySelector("#server-url");
      const message = document.querySelector("#message");
      const savedUrl = localStorage.getItem("bittyServerUrl");

      function validPrivateUrl(value) {
        try {
          const url = new URL(value);
          return url.protocol === "https:" && (url.hostname === "ts.net" || url.hostname.endsWith(".ts.net"));
        } catch {
          return false;
        }
      }

      if (savedUrl && validPrivateUrl(savedUrl)) {
        window.location.replace(savedUrl);
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const value = field.value.trim().replace(/\/$/, "");
        if (!validPrivateUrl(value)) {
          message.textContent = "Use o endereço HTTPS privado terminado em .ts.net.";
          field.focus();
          return;
        }
        localStorage.setItem("bittyServerUrl", value);
        window.location.assign(value);
      });
    </script>
  </body>
</html>
