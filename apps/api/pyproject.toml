[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptobot-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1", "aiosqlite>=0.21,<1", "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3", "email-validator>=2.2,<3", "pyjwt>=2.10,<3", "argon2-cffi>=23,<26",
  "cryptography>=44,<46", "httpx>=0.28,<1", "redis>=5,<7", "celery>=5.4,<6"
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E9", "F"]
ignore = ["F401"]
[tool.setuptools.packages.find]
include = ["app*"]
